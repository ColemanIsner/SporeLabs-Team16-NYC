<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spore Review</title>
<style>
  :root { --bg:#0e1013; --panel:#171a1f; --line:#2a2f37; --text:#e7e9ee; --dim:#8b93a1; --good:#3fb950; --meh:#d29922; --bad:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, system-ui, sans-serif; display:grid; grid-template-columns:300px 1fr; height:100vh; }
  aside { border-right:1px solid var(--line); overflow:auto; }
  aside header { position:sticky; top:0; background:var(--bg); padding:10px; border-bottom:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; }
  aside header button { background:var(--panel); color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:3px 8px; cursor:pointer; font-size:12px; }
  aside header button.on { color:var(--text); border-color:var(--acc); }
  .item { padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:8px; align-items:center; }
  .item.sel { background:var(--panel); box-shadow:inset 3px 0 var(--acc); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--line); flex:none; }
  .dot.good { background:var(--good); } .dot.meh { background:var(--meh); } .dot.bad { background:var(--bad); }
  .item small { color:var(--dim); display:block; }
  main { overflow:auto; padding:16px; }
  .vids { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .vids.single { grid-template-columns:1fr; max-width:1100px; }
  figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  figcaption { padding:6px 10px; color:var(--dim); font-size:12px; }
  video { width:100%; display:block; background:#000; }
  .bar { display:flex; gap:8px; margin:14px 0; align-items:center; flex-wrap:wrap; }
  .bar button { font-size:14px; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
  .bar button.good.on { background:var(--good); color:#000; } .bar button.meh.on { background:var(--meh); color:#000; } .bar button.bad.on { background:var(--bad); color:#000; }
  textarea { width:100%; min-height:70px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; overflow:auto; max-height:260px; color:var(--dim); }
  .keys { color:var(--dim); font-size:12px; }
  .saved { color:var(--good); font-size:12px; }
  .empty { color:var(--dim); padding:40px; text-align:center; }
</style>
</head>
<body>
<aside>
  <header id="filters"></header>
  <div id="list"></div>
</aside>
<main id="main"><div class="empty">No clips in data/ yet. This page refreshes every 5 s.</div></main>
<script>
let clips = [], sel = null, filter = "all";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const label = (c) => {
  const cond = c.meta?.condition;
  return cond ? Object.entries(cond).filter(([k]) => k !== "kind").map(([,v]) => v).join(" · ") : c.clip_id;
};
async function refresh() {
  try {
    const r = await fetch("/api/clips"); const next = await r.json();
    const changed = JSON.stringify(next.map(c => [c.id, c.mtime, c.eval && 1])) !== JSON.stringify(clips.map(c => [c.id, c.mtime, c.eval && 1]));
    // keep local review state for the selected clip while typing
    next.forEach(c => { const old = clips.find(o => o.id === c.id); if (old && old._dirty) { c.review = old.review; c._dirty = true; } });
    clips = next;
    if (!sel && clips.length) sel = clips[0].id;
    renderList(); if (changed) renderMain();
  } catch (e) {}
}
function visible() {
  return clips.filter(c => filter === "all" || (filter === "unrated" ? !c.review?.rating : c.group === filter));
}
function renderList() {
  const groups = ["all", "unrated", ...new Set(clips.map(c => c.group))];
  $("#filters").innerHTML = groups.map(g => `<button class="${g===filter?"on":""}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
  $("#filters").querySelectorAll("button").forEach(b => b.onclick = () => { filter = b.dataset.g; renderList(); });
  $("#list").innerHTML = visible().map(c => `
    <div class="item ${c.id===sel?"sel":""}" data-id="${esc(c.id)}">
      <span class="dot ${esc(c.review?.rating||"")}"></span>
      <div>${esc(label(c))}<small>${esc(c.group)} · ${esc(c.clip_id)}</small></div>
    </div>`).join("");
  $("#list").querySelectorAll(".item").forEach(d => d.onclick = () => { sel = d.dataset.id; renderList(); renderMain(); });
}
function renderMain() {
  const c = clips.find(c => c.id === sel);
  if (!c) return;
  const v = (src, cap) => `<figure><video src="/file/${encodeURI(src)}" autoplay muted loop playsinline controls></video><figcaption>${esc(cap)}</figcaption></figure>`;
  const ev = c.eval ? `<pre>${esc(JSON.stringify({fidelity:c.eval.fidelity, yolo:c.eval.yolo && {...c.eval.yolo, boxes:undefined}, reason:c.eval.reason, failure:c.eval.failure, failure_reasons:c.eval.failure_reasons}, null, 1))}</pre>` : "";
  $("#main").innerHTML = `
    <div class="vids ${c.seed_src?"":"single"}">
      ${c.seed_src ? v(c.seed_src, "SEED (real)") : ""}
      ${v(c.src, (c.seed_src ? "VARIANT · " : "") + label(c))}
    </div>
    <div class="bar">
      <button class="good ${c.review?.rating==="good"?"on":""}" data-r="good">1 · Good</button>
      <button class="meh ${c.review?.rating==="meh"?"on":""}" data-r="meh">2 · Meh</button>
      <button class="bad ${c.review?.rating==="bad"?"on":""}" data-r="bad">3 · Bad</button>
      <span class="keys">j/k next/prev · 1/2/3 rate · n note · ⌘↵ save note · space play/pause</span>
      <span class="saved" id="saved"></span>
    </div>
    <textarea id="note" placeholder="Reply / note for the agents (e.g. 'fog too uniform, cars melt at frame 40')">${esc(c.review?.note||"")}</textarea>
    ${ev}
    <pre>${esc(JSON.stringify(c.meta, null, 1))}</pre>`;
  const vids = [...document.querySelectorAll("video")];
  vids.forEach(vd => vd.addEventListener("play", () => vids.forEach(o => { if (o !== vd && Math.abs(o.currentTime - vd.currentTime) > 0.2) o.currentTime = vd.currentTime; })));
  document.querySelectorAll(".bar button").forEach(b => b.onclick = () => save(b.dataset.r));
  $("#note").oninput = () => { c._dirty = true; c.review = {...(c.review||{}), note: $("#note").value}; };
}
async function save(rating) {
  const c = clips.find(c => c.id === sel); if (!c) return;
  const note = $("#note").value;
  c.review = { rating: rating ?? c.review?.rating ?? null, note };
  await fetch("/api/review", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ id: c.id, clip_id: c.clip_id, ...c.review }) });
  c._dirty = false;
  renderList(); renderMain(); $("#saved").textContent = "saved ✓";
}
function move(d) {
  const vs = visible(); const i = vs.findIndex(c => c.id === sel);
  const n = vs[Math.max(0, Math.min(vs.length - 1, i + d))]; if (n) { sel = n.id; renderList(); renderMain(); }
}
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); e.target.blur(); } if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "j") move(1); else if (e.key === "k") move(-1);
  else if (e.key === "1") save("good"); else if (e.key === "2") save("meh"); else if (e.key === "3") save("bad");
  else if (e.key === "n") { e.preventDefault(); $("#note").focus(); }
  else if (e.key === " ") { e.preventDefault(); const vs = [...document.querySelectorAll("video")]; const p = vs[0]?.paused; vs.forEach(v => p ? v.play() : v.pause()); }
});
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
